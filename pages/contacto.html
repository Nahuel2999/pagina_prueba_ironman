<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Primera Página | Contacto</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <header>
    <h1>Mi Primera Página</h1>

    <nav>
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="sobre-mi.html">Sobre mí</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>
  </header>

  <main>
    <section id="contacto" class="seccion-contacto">
      <h2>Contacto</h2>

      <form action="#" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribí tu nombre" required>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" placeholder="ejemplo@email.com" required>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" placeholder="Escribí tu mensaje" required></textarea>

        <input type="submit" value="Enviar">
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 - Mi Primera Página</p>
    <p>Contacto: ejemplo@email.com</p>
  </footer>
</body>
</html>
